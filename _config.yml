# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Echoin 的博客
subtitle: 'Web安全 · 渗透测试 · CTF · 靶场'
description: '记录 Web 安全、渗透测试学习笔记、CTF 比赛 Writeup 与靶场练习'
keywords: 'Web安全,渗透测试,CTF,Writeup,靶场,网络安全,漏洞挖掘,代码审计'
author: Echoin
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
## 部署到 GitHub Pages 后使用此地址；接入自定义域名后请改成你的域名，例如 https://your-domain.com
url: https://echoin.xyz
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - 'payloads/**'

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
# 开启文章资源文件夹：hexo new "xxx" 时会同时创建同名文件夹，用于存放截图等图片，
# 正文中用 {% asset_img image.png 描述 %} 引用
post_asset_folder: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# 本地搜索插件配置 (hexo-generator-searchdb)
search:
  path: search.xml
  field: post
  content: true
  format: striptags

# RSS 订阅配置 (hexo-generator-feed)
feed:
  enable: true
  type:
    - atom
    - rss2
  path:
    - atom.xml
    - rss2.xml
  limit: 20
  content: false
  order_by: -date

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: butterfly

# Deployment
## 本博客使用 GitHub Actions 自动部署，无需在此配置 git deploy
deploy:
  type: ''
